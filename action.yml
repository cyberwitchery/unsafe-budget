name: unsafe-budget
description: Run unsafe-budget in CI without cargo install by using release binaries
author: cyberwitchery

inputs:
  mode:
    description: Command to run (scan, check, update, or plugins)
    required: false
    default: check
  args:
    description: Additional CLI arguments passed to unsafe-budget, split on whitespace
    required: false
    default: ""
  version:
    description: Release tag to install (defaults to the action's package version), or "latest"
    required: false
    default: ""
  repository:
    description: Repository to download release assets from
    required: false
    default: cyberwitchery/unsafe-budget
  working-directory:
    description: Working directory where unsafe-budget is executed
    required: false
    default: .
  verify:
    description: >
      Verify the downloaded archive's build provenance attestation with
      `gh attestation verify` before running it. Releases before the first
      attested one have no attestation and need "false".
    required: false
    default: "true"
  token:
    description: GitHub token used to resolve "latest" and to verify attestations
    required: false
    default: ${{ github.token }}
  lock-artifact:
    description: >
      When `check` finds a budget violation, run `update` and upload the new
      `unsafe-budget.lock` as an artifact of this name, for
      `scripts/accept-unsafe.sh`. Empty disables it.
    required: false
    default: unsafe-budget-lock

outputs:
  lock:
    description: Path of the lock `update` wrote after a violation, relative to the workspace; empty otherwise
    value: ${{ steps.run.outputs.lock }}

runs:
  using: composite
  steps:
    - name: Detect target triple
      id: detect
      shell: bash
      run: |
        set -euo pipefail
        case "${RUNNER_OS}" in
          Linux)
            case "${RUNNER_ARCH}" in
              X64) target="x86_64-unknown-linux-gnu" ;;
              *)
                echo "unsupported Linux architecture: ${RUNNER_ARCH}" >&2
                exit 1
                ;;
            esac
            bin_name="unsafe-budget"
            ;;
          macOS)
            case "${RUNNER_ARCH}" in
              X64) target="x86_64-apple-darwin" ;;
              ARM64) target="aarch64-apple-darwin" ;;
              *)
                echo "unsupported macOS architecture: ${RUNNER_ARCH}" >&2
                exit 1
                ;;
            esac
            bin_name="unsafe-budget"
            ;;
          Windows)
            case "${RUNNER_ARCH}" in
              X64) target="x86_64-pc-windows-msvc" ;;
              *)
                echo "unsupported Windows architecture: ${RUNNER_ARCH}" >&2
                exit 1
                ;;
            esac
            bin_name="unsafe-budget.exe"
            ;;
          *)
            echo "unsupported runner OS: ${RUNNER_OS}" >&2
            exit 1
            ;;
        esac

        echo "target=${target}" >> "${GITHUB_OUTPUT}"
        echo "bin_name=${bin_name}" >> "${GITHUB_OUTPUT}"

    - name: Resolve version
      id: version
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        GH_TOKEN: ${{ inputs.token }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        bash "${ACTION_PATH}/scripts/action-version.sh"

    - name: Download and install unsafe-budget
      shell: bash
      env:
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_VERIFY: ${{ inputs.verify }}
        GH_TOKEN: ${{ inputs.token }}
        TAG: ${{ steps.version.outputs.tag }}
        TARGET: ${{ steps.detect.outputs.target }}
        BIN_NAME: ${{ steps.detect.outputs.bin_name }}
      run: |
        set -euo pipefail
        archive="unsafe-budget-${TAG}-${TARGET}.tar.gz"
        url="https://github.com/${INPUT_REPOSITORY}/releases/download/${TAG}/${archive}"

        download_dir="${RUNNER_TEMP}/unsafe-budget-download"
        extract_dir="${RUNNER_TEMP}/unsafe-budget-extract"
        install_dir="${RUNNER_TEMP}/unsafe-budget-bin"
        mkdir -p "${download_dir}" "${extract_dir}" "${install_dir}"

        curl -fsSL -o "${download_dir}/${archive}" "${url}"

        case "${INPUT_VERIFY}" in
          true)
            gh attestation verify "${download_dir}/${archive}" \
              --repo "${INPUT_REPOSITORY}" \
              --signer-workflow "${INPUT_REPOSITORY}/.github/workflows/release.yml"
            ;;
          false) ;;
          *)
            echo "verify must be true or false, got: ${INPUT_VERIFY}" >&2
            exit 1
            ;;
        esac

        tar -xzf "${download_dir}/${archive}" -C "${extract_dir}"

        bin_path="$(find "${extract_dir}" -type f -name "${BIN_NAME}" | head -n 1)"
        if [ -z "${bin_path}" ]; then
          echo "failed to find ${BIN_NAME} in downloaded archive" >&2
          exit 1
        fi

        cp "${bin_path}" "${install_dir}/${BIN_NAME}"
        chmod +x "${install_dir}/${BIN_NAME}"
        echo "${install_dir}" >> "${GITHUB_PATH}"

    - name: Run unsafe-budget
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_LOCK_ARTIFACT: ${{ inputs.lock-artifact }}
      run: |
        set -euo pipefail
        read -r -a args <<< "${INPUT_ARGS}"
        status=0
        unsafe-budget "${INPUT_MODE}" ${args[@]+"${args[@]}"} || status=$?
        echo "status=${status}" >> "${GITHUB_OUTPUT}"

        # counts differ between platforms, so a violation keeps this runner's
        # lock. only a lock that update changed is kept: in caps mode the fix
        # is the config, not the lock.
        if [ "${status}" = 2 ] && [ "${INPUT_MODE}" = check ] && [ -n "${INPUT_LOCK_ARTIFACT}" ]; then
          unsafe-budget update ${args[@]+"${args[@]}"}
          lock="$(git -C "${GITHUB_WORKSPACE}" status --porcelain -- ':(glob)**/unsafe-budget.lock' | awk '$1 ~ /M$/ { print $2; exit }')"
          if [ -n "${lock}" ]; then
            stage="${RUNNER_TEMP}/unsafe-budget-lock"
            mkdir -p "${stage}"
            cp "${GITHUB_WORKSPACE}/${lock}" "${stage}/unsafe-budget.lock"
            echo "${lock}" > "${stage}/path"
            echo "lock=${lock}" >> "${GITHUB_OUTPUT}"
            echo "stage=${stage}" >> "${GITHUB_OUTPUT}"
          fi
        fi

    - name: Upload lock
      if: steps.run.outputs.stage != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.lock-artifact }}
        path: ${{ steps.run.outputs.stage }}

    - name: Report
      if: steps.run.outputs.status != '0'
      shell: bash
      env:
        STATUS: ${{ steps.run.outputs.status }}
        LOCK: ${{ steps.run.outputs.lock }}
        ARTIFACT: ${{ inputs.lock-artifact }}
      run: |
        if [ -n "${LOCK}" ]; then
          echo "::error::unsafe budget exceeded. after review, accept with scripts/accept-unsafe.sh <pr> from cyberwitchery/unsafe-budget (artifact ${ARTIFACT}, ${LOCK})"
        fi
        exit "${STATUS}"
