name: release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    name: release ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_ext: ""
            publish_crates: true
          - os: macos-15
            target: x86_64-apple-darwin
            bin_ext: ""
            publish_crates: false
          - os: macos-15
            target: aarch64-apple-darwin
            bin_ext: ""
            publish_crates: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_ext: ".exe"
            publish_crates: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: package binaries
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          archive_base="unsafe-budget-${REF_NAME}-${{ matrix.target }}"
          dist_root="${RUNNER_TEMP}/dist"
          if command -v cygpath >/dev/null 2>&1; then
            dist_root="$(cygpath -u "${RUNNER_TEMP}")/dist"
          fi
          stage_dir="${dist_root}/${archive_base}"
          mkdir -p "${stage_dir}"
          cp "target/${{ matrix.target }}/release/unsafe-budget${{ matrix.bin_ext }}" "${stage_dir}/"
          cp "target/${{ matrix.target }}/release/cargo-unsafe-budget${{ matrix.bin_ext }}" "${stage_dir}/"
          cp README.md LICENSE "${stage_dir}/"
          tar -czf "${dist_root}/${archive_base}.tar.gz" -C "${dist_root}" "${archive_base}"

      - name: upload packaged binaries
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ runner.temp }}/dist/*.tar.gz

      - name: install sbom tool
        if: matrix.publish_crates
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-cyclonedx

      - name: generate sbom
        if: matrix.publish_crates
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          (cd /tmp && cargo cyclonedx --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
            --format json \
            --override-filename "sbom-${REF_NAME}.cdx")

      - name: collect sbom files
        if: matrix.publish_crates
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/unsafe-budget-sbom
          find /tmp -maxdepth 1 -type f -name "sbom-${REF_NAME}.cdx.json" \
            -exec mv {} /tmp/unsafe-budget-sbom/ \;
          find "$GITHUB_WORKSPACE" -type f -name "sbom-${REF_NAME}.cdx.json" \
            -exec mv {} /tmp/unsafe-budget-sbom/ \;

      - name: upload sbom
        if: matrix.publish_crates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.ref_name }}
          path: "/tmp/unsafe-budget-sbom/sbom-${{ github.ref_name }}.cdx.json"
          if-no-files-found: error

      - name: attach sbom to release
        if: matrix.publish_crates
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: /tmp/unsafe-budget-sbom/sbom-${{ github.ref_name }}.cdx.json

      - name: publish to crates.io
        if: matrix.publish_crates
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
