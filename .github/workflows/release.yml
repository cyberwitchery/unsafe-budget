name: release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    name: release ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_ext: ""
            publish_crates: true
          - os: macos-14
            target: x86_64-apple-darwin
            bin_ext: ""
            publish_crates: false
          - os: macos-14
            target: aarch64-apple-darwin
            bin_ext: ""
            publish_crates: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_ext: ".exe"
            publish_crates: false
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: package binaries
        shell: bash
        run: |
          set -euo pipefail
          archive_base="unsafe-budget-${{ github.ref_name }}-${{ matrix.target }}"
          dist_root="${RUNNER_TEMP}/dist"
          if command -v cygpath >/dev/null 2>&1; then
            dist_root="$(cygpath -u "${RUNNER_TEMP}")/dist"
          fi
          stage_dir="${dist_root}/${archive_base}"
          mkdir -p "${stage_dir}"
          cp "target/${{ matrix.target }}/release/unsafe-budget${{ matrix.bin_ext }}" "${stage_dir}/"
          cp "target/${{ matrix.target }}/release/cargo-unsafe-budget${{ matrix.bin_ext }}" "${stage_dir}/"
          cp README.md LICENSE "${stage_dir}/"
          tar -czf "${dist_root}/${archive_base}.tar.gz" -C "${dist_root}" "${archive_base}"

      - name: upload packaged binaries
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ runner.temp }}/dist/*.tar.gz

      - name: install sbom tool
        if: matrix.publish_crates
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx

      - name: generate sbom
        if: matrix.publish_crates
        run: |
          (cd /tmp && cargo cyclonedx --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
            --format json \
            --override-filename "sbom-${{ github.ref_name }}.cdx")

      - name: collect sbom files
        if: matrix.publish_crates
        run: |
          set -euo pipefail
          mkdir -p /tmp/unsafe-budget-sbom
          find /tmp -maxdepth 1 -type f -name "sbom-${{ github.ref_name }}.cdx.json" \
            -exec mv {} /tmp/unsafe-budget-sbom/ \;
          find "$GITHUB_WORKSPACE" -type f -name "sbom-${{ github.ref_name }}.cdx.json" \
            -exec mv {} /tmp/unsafe-budget-sbom/ \;

      - name: upload sbom
        if: matrix.publish_crates
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.ref_name }}
          path: "/tmp/unsafe-budget-sbom/sbom-${{ github.ref_name }}.cdx.json"
          if-no-files-found: error

      - name: attach sbom to release
        if: matrix.publish_crates
        uses: softprops/action-gh-release@v3
        with:
          files: /tmp/unsafe-budget-sbom/sbom-${{ github.ref_name }}.cdx.json

      - name: publish to crates.io
        if: matrix.publish_crates
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
