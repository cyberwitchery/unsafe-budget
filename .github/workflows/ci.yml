name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test
      - run: cargo test --test integration_test -- --ignored

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  unsafe-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Dogfood our own action: downloads the release binary, no compile.
      - uses: ./
        with:
          mode: check

  # a violation keeps the runner's lock: lower one count in a fixture baseline,
  # check, and expect the failure plus the restored lock as an artifact.
  action-lock:
    runs-on: ubuntu-latest
    env:
      FIXTURE: tests/fixtures/sample_workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          mode: update
          working-directory: ${{ env.FIXTURE }}
      - name: Lower a count
        run: |
          cp "$FIXTURE/unsafe-budget.lock" "$RUNNER_TEMP/expected.lock"
          perl -0pi -e 's/unsafe_count = (\d+)/"unsafe_count = " . ($1 - 1)/e' "$FIXTURE/unsafe-budget.lock"
          if cmp -s "$FIXTURE/unsafe-budget.lock" "$RUNNER_TEMP/expected.lock"; then exit 1; fi
          git add "$FIXTURE/unsafe-budget.lock"
      - id: check
        uses: ./
        continue-on-error: true
        with:
          mode: check
          working-directory: ${{ env.FIXTURE }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsafe-budget-lock
          path: ${{ runner.temp }}/artifact
      - name: Expect the violation and the restored lock
        env:
          OUTCOME: ${{ steps.check.outcome }}
          LOCK: ${{ steps.check.outputs.lock }}
        run: |
          test "$OUTCOME" = failure
          test "$LOCK" = "$FIXTURE/unsafe-budget.lock"
          test "$(cat "$RUNNER_TEMP/artifact/path")" = "$LOCK"
          cmp "$RUNNER_TEMP/artifact/unsafe-budget.lock" "$RUNNER_TEMP/expected.lock"

  sbom:
    uses: cyberwitchery/.github/.github/workflows/sbom.yml@64ffd6a08c3e9626a681c8be1c8ad056765f3b85 # main
    with:
      mode: report

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny
      - run: cargo deny check

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --lcov --output-path lcov.info --fail-under-lines 70
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: false

  success:
    needs: [fmt, clippy, test, doc, deny, coverage, unsafe-budget, action-lock, sbom]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: check all jobs passed
        run: |
          if [[ "${{ needs.fmt.result }}" != "success" ]] ||
             [[ "${{ needs.clippy.result }}" != "success" ]] ||
             [[ "${{ needs.test.result }}" != "success" ]] ||
             [[ "${{ needs.doc.result }}" != "success" ]] ||
             [[ "${{ needs.deny.result }}" != "success" ]] ||
             [[ "${{ needs.coverage.result }}" != "success" ]] ||
             [[ "${{ needs.unsafe-budget.result }}" != "success" ]] ||
             [[ "${{ needs.action-lock.result }}" != "success" ]] ||
             [[ "${{ needs.sbom.result }}" != "success" ]]; then
            echo "one or more jobs failed"
            exit 1
          fi
          echo "all jobs passed"
